name: 🎬 Build ProCam APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📥 Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -sL "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

      - name: 🔧 Setup gradlew permissions
        run: chmod +x gradlew

      - name: 📦 Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: ✅ Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/ProCam-Studio.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProCam-Studio-APK
          path: release/ProCam-Studio.apk
          retention-days: 30

      - name: 🏷️ Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "ProCam Studio v1.0.${{ github.run_number }}"
          body: |
            ## 📱 ProCam Studio APK
            Download ProCam-Studio.apk di bawah, install di HP Android.
          files: release/ProCam-Studio.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
